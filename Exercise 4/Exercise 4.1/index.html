<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4.1 - SVG House</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }
        svg {
            border: 1px solid #ccc;
            background-color: #87CEEB; /* Sky background */
            display: block;
            margin-bottom: 20px;
        }
        .window-style {
            fill: #ADD8E6;
            stroke: #ffffff;
            stroke-width: 2;
        }
    </style>
</head>
<body>

    <h1>Exercise 4.1: SVG House and Coordinate System</h1>

    <!-- 500x500 Canvas -->
    <svg width="500" height="500" viewBox="0 0 500 500">
        
        <!-- 1. Grass (rect) -->
        <rect x="0" y="300" width="500" height="200" fill="#008000" />

        <!-- 2. Sun (circle) -->
        <circle cx="400" cy="100" r="40" fill="#FFFF00" />

        <!-- 3. Curved Path to Door (path) -->
        <path d="M 250 350 C 200 400, 200 450, 280 500" fill="none" stroke="#FFA500" stroke-width="8" />
        <path d="M 230 350 C 180 400, 180 450, 250 500" fill="none" stroke="#FFA500" stroke-width="4" />

        <!-- 4. Tree Trunk (rect) & 2 Overlapping Triangles (polygon) -->
        <rect x="80" y="270" width="20" height="80" fill="#8B4513" />
        <polygon points="90,180 50,250 130,250" fill="#1E8449" />
        <polygon points="90,220 40,290 140,290" fill="#228B22" />

        <!-- 5. House Body (rect) -->
        <rect x="150" y="200" width="200" height="150" fill="#A0522D" />

        <!-- 6. House Roof (polygon) -->
        <polygon points="150,200 250,100 350,200" fill="#8B0000" />

        <!-- 7. Door (rect) & Knob (circle) -->
        <rect x="225" y="270" width="50" height="80" fill="#654321" />
        <circle cx="265" cy="315" r="4" fill="#000000" />

        <!-- 8. Grouped Windows using <g> and transform/translate -->
        <g id="windows-group" class="window-style">
            <rect width="35" height="35" transform="translate(175, 225)" />
            <rect width="35" height="35" transform="translate(290, 225)" />
        </g>

        <!-- 9. Text Annotation (text) -->
        <text x="380" y="290" font-family="sans-serif" font-size="24" fill="#000000">House</text>

    </svg>

    <h2>Annotated Coordinate System</h2>
    <img src="coordinates.png" alt="Annotated SVG Coordinate System" style="max-width: 500px; border: 1px solid #ccc;">

</body>
</html>
